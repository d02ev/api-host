[project]
name = "api-host"
version = "0.1.0"
description = "Modular API host"
readme = "README.md"
authors = [
    { name = "d02ev", email = "vikramadityapratapsingh98@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.7",
    "pydantic-settings>=2.16.3",
    "supabase>=2.34.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
api-host = "api_host:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
